<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driveline Running & Agility Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #e11d48;
      --accent-hover: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 10px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }

    header h1 {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1.8rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: bold;
    }

    select {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .exercise-card {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .exercise-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .prescribed-badge {
      background: rgba(225, 29, 72, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid var(--accent);
    }

    .rest-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .video-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .video-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .video-container {
      display: none;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #000;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .tracker-area {
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .tracker-area label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .check-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .check-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      transition: all 0.2s;
    }

    .check-btn.completed {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
      }
      .card-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Driveline Running Program</h1>
    <p>Select your day and week to log sets and view exercise demos.</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="daySelect">Select Day</label>
      <select id="daySelect" onchange="renderWorkout()">
        <option value="Tuesday">Tuesday - Linear Acceleration Focus</option>
        <option value="Wednesday">Wednesday - A-Series / Bounds Focus</option>
        <option value="Thursday">Thursday - Medballs & Plyometrics</option>
        <option value="Saturday">Saturday - Change of Direction Focus</option>
      </select>
    </div>

    <div class="control-group">
      <label for="weekSelect">Select Week</label>
      <select id="weekSelect" onchange="renderWorkout()">
        <option value="1">Week 1</option>
        <option value="2">Week 2</option>
        <option value="3">Week 3</option>
        <option value="4">Week 4</option>
        <option value="5">Week 5</option>
        <option value="6">Week 6</option>
      </select>
    </div>
  </div>

  <div id="workoutContainer"></div>

  <script>
    // Program Data mapped directly from PDF
    const workoutData = {
      "Tuesday": [
        {
          name: "Hop Series (2 leg/1 leg Linear)",
          rest: "30s",
          query: "Driveline linear hop series",
          prescribed: { "1": "1x10 ea", "2": "1x10 ea", "3": "1x10 ea", "4": "1x10 ea", "5": "1x10 ea", "6": "1x10 ea" }
        },
        {
          name: "Heavy Banded / Kneeling Starts",
          rest: "30s",
          query: "Heavy banded linear start sprint",
          prescribed: {
            "1": "Heavy Banded Start: 1x4 ea",
            "2": "Heavy Banded Start: 1x4 ea",
            "3": "Heavy Banded Start: 1x4 ea",
            "4": "Switch to 1/2 Kneeling Linear Starts (3 hard steps): 1x4 ea",
            "5": "1/2 Kneeling Linear Starts (3 hard steps): 1x4 ea",
            "6": "1/2 Kneeling Linear Starts (3 hard steps): 1x4 ea"
          }
        },
        {
          name: "Technical Starts",
          rest: "30s",
          query: "High knee falling start drill",
          prescribed: {
            "1": "High Knee Falling Starts (1 hard step): 1x4 ea",
            "2": "High Knee Falling Starts (1 hard step): 1x4 ea",
            "3": "High Knee Falling Starts (1 hard step): 1x4 ea",
            "4": "2-Point Starts (3 hard steps): 1x4 ea",
            "5": "2-Point Starts (3 hard steps): 1x4 ea",
            "6": "2-Point Starts (3 hard steps): 1x4 ea"
          }
        },
        {
          name: "Linear Sprint Work",
          rest: "30s",
          query: "2 point linear start 10 yard sprint",
          prescribed: {
            "1": "2-Point Start 10yd Sprint: 1x2-3 ea",
            "2": "2-Point Start 10yd Sprint: 1x3-4 ea",
            "3": "2-Point Start 10yd Sprint: 1x3-4 ea",
            "4": "Switch to 1/2 Kneeling Start 10yd Sprint: 1x3-4 ea",
            "5": "1/2 Kneeling Start 10yd Sprint: 1x4 ea",
            "6": "1/2 Kneeling Start 10yd Sprint: 1x2-3 ea"
          }
        }
      ],
      "Wednesday": [
        {
          name: "Hop Series (2 leg/1 leg Linear/Lateral)",
          rest: "30s",
          query: "Linear lateral hop series plyometrics",
          prescribed: { "1": "1x10 ea", "2": "1x10 ea", "3": "1x10 ea", "4": "1x10 ea", "5": "1x10 ea", "6": "1x10 ea" }
        },
        {
          name: "A-March",
          rest: "30s",
          query: "A March track drill",
          prescribed: { "1": "2x10yd", "2": "2x10yd", "3": "2x10yd", "4": "2x10yd", "5": "2x10yd", "6": "2x10yd" }
        },
        {
          name: "A-Hop",
          rest: "30s",
          query: "A Hop track drill",
          prescribed: { "1": "2x10yd", "2": "2x10yd", "3": "2x10yd", "4": "2x10yd", "5": "2x10yd", "6": "2x10yd" }
        },
        {
          name: "1-2 Pause",
          rest: "30s",
          query: "1 2 pause drill sprint",
          prescribed: { "1": "2x10yd", "2": "2x10yd", "3": "2x10yd", "4": "2x10yd", "5": "2x10yd", "6": "2x10yd" }
        },
        {
          name: "3-Hop Series",
          rest: "30s",
          query: "3 hop series drill sprint",
          prescribed: { "1": "2x10yd", "2": "2x10yd", "3": "2x10yd", "4": "2x10yd", "5": "2x10yd", "6": "2x10yd" }
        },
        {
          name: "A-Run",
          rest: "30s",
          query: "A Run sprint drill technique",
          prescribed: { "1": "2x10yd", "2": "2x10yd", "3": "2x10yd", "4": "2x10yd", "5": "2x10yd", "6": "2x10yd" }
        },
        {
          name: "Bounds",
          rest: "30s",
          query: "Bounding drills sprint acceleration",
          prescribed: { "1": "2x8 steps", "2": "2x8 steps", "3": "2x8 steps", "4": "2x8 steps", "5": "2x8 steps", "6": "2x8 steps" }
        },
        {
          name: "Straight Leg Bounds",
          rest: "30s",
          query: "Straight leg bounds drill",
          prescribed: { "1": "2x8 steps", "2": "2x8 steps", "3": "2x8 steps", "4": "2x8 steps", "5": "2x8 steps", "6": "2x8 steps" }
        },
        {
          name: "Tempo Runs",
          rest: "5-7 min Recovery",
          query: "Tempo runs conditioning",
          prescribed: { "1": "2 x 6 x 80yd", "2": "2 x 6 x 60yd", "3": "2 x 6 x 60yd", "4": "2 x 6 x 40yd", "5": "2 x 6 x 40yd", "6": "2 x 6 x 80yd" }
        }
      ],
      "Thursday": [
        {
          name: "Hop Series (2 leg/1 leg Linear/Lateral)",
          rest: "30s",
          query: "Linear lateral hop series",
          prescribed: { "1": "1x10 ea", "2": "1x10 ea", "3": "1x10 ea", "4": "1x10 ea", "5": "1x10 ea", "6": "1x10 ea" }
        },
        {
          name: "Hop Back to MB Scoop Toss",
          rest: "30s",
          query: "Hop back to medball scoop toss",
          prescribed: { "1": "2x4 ea", "2": "2x4 ea", "3": "2x4 ea", "4": "2x4 ea", "5": "2x4 ea", "6": "2x4 ea" }
        },
        {
          name: "Step Behind MB Rollover OH MB Slam",
          rest: "30s",
          query: "Overhead medball slam drill",
          prescribed: { "1": "2x4 ea", "2": "2x4 ea", "3": "2x4 ea", "4": "2x4 ea", "5": "2x4 ea", "6": "2x4 ea" }
        },
        {
          name: "Medball Shotput",
          rest: "30s",
          query: "Medball shotput rotational throw",
          prescribed: { "1": "2x6", "2": "2x6", "3": "2x6", "4": "2x6", "5": "2x6", "6": "2x6" }
        },
        {
          name: "Hurdle Work (Linear)",
          rest: "30s",
          query: "Hurdle hop series linear",
          prescribed: {
            "1": "2 leg / 1 leg Linear: 1-2x ea",
            "2": "2 leg / 1 leg Linear: 1-2x ea",
            "3": "2 leg / 1 leg Linear: 1-2x ea",
            "4": "Linear w/ Sprint Out: 1-2x ea",
            "5": "Linear w/ Sprint Out: 1-2x ea",
            "6": "Linear w/ Sprint Out: 1-2x ea"
          }
        },
        {
          name: "Hurdle Work (Lateral)",
          rest: "30s",
          query: "Hurdle hop series lateral",
          prescribed: {
            "1": "2 leg / 1 leg Lateral: 1-2x ea",
            "2": "2 leg / 1 leg Lateral: 1-2x ea",
            "3": "2 leg / 1 leg Lateral: 1-2x ea",
            "4": "Lateral w/ Sprint Out: 1-2x ea",
            "5": "Lateral w/ Sprint Out: 1-2x ea",
            "6": "Lateral w/ Sprint Out: 1-2x ea"
          }
        },
        {
          name: "Hurdle Work (Staircase)",
          rest: "30s",
          query: "Staircase hurdle hop drill",
          prescribed: {
            "1": "2 leg / 1 leg Staircase: 1-2x ea",
            "2": "2 leg / 1 leg Staircase: 1-2x ea",
            "3": "2 leg / 1 leg Staircase: 1-2x ea",
            "4": "Staircase w/ Sprint Out: 1-2x ea",
            "5": "Staircase w/ Sprint Out: 1-2x ea",
            "6": "Staircase w/ Sprint Out: 1-2x ea"
          }
        },
        {
          name: "Skater Ladder Work",
          rest: "30s",
          query: "Skater ladder with stick drill",
          prescribed: {
            "1": "Skater Ladder w/ Stick: 2x ea",
            "2": "Skater Ladder w/ Stick: 2x ea",
            "3": "Skater Ladder w/ Stick: 3x ea",
            "4": "Switch to Skater Ladder w/ Sprint Out: 2x ea",
            "5": "Skater Ladder w/ Sprint Out: 3x ea",
            "6": "Skater Ladder w/ Sprint Out: 2x ea"
          }
        }
      ],
      "Saturday": [
        {
          name: "Hop Series (2 leg/1 leg Lateral)",
          rest: "30s",
          query: "Lateral hop series plyometrics",
          prescribed: { "1": "1x10 ea", "2": "1x10 ea", "3": "1x10 ea", "4": "1x10 ea", "5": "1x10 ea", "6": "1x10 ea" }
        },
        {
          name: "Band Resisted Crossover",
          rest: "30s",
          query: "Band resisted crossover drill",
          prescribed: { "1": "1x3 ea", "2": "1x3 ea", "3": "1x3 ea", "4": "1x3 ea", "5": "1x3 ea", "6": "1x3 ea" }
        },
        {
          name: "Band Resisted Shuffle to Crossover",
          rest: "30s",
          query: "Band resisted shuffle to crossover drill",
          prescribed: { "1": "1x3 ea", "2": "1x3 ea", "3": "1x3 ea", "4": "1x3 ea", "5": "1x3 ea", "6": "1x3 ea" }
        },
        {
          name: "T Drill Work",
          rest: "30s",
          query: "T Drill change of direction speed",
          prescribed: {
            "1": "Technical T Drill: 2x",
            "2": "Technical T Drill: 3x",
            "3": "Technical T Drill: 4x",
            "4": "Add Competition to T Drill: 5x",
            "5": "Competition T Drill: 5x",
            "6": "Competition T Drill: 3x"
          }
        }
      ]
    };

    function renderWorkout() {
      const day = document.getElementById("daySelect").value;
      const week = document.getElementById("weekSelect").value;
      const container = document.getElementById("workoutContainer");

      const exercises = workoutData[day] || [];
      container.innerHTML = "";

      exercises.forEach((ex, exIdx) => {
        const targetText = ex.prescribed[week] || "1 Set";
        const totalSets = parseSetCount(targetText);

        const card = document.createElement("div");
        card.className = "exercise-card";

        let setsButtonsHtml = "";
        for (let s = 1; s <= totalSets; s++) {
          const key = `log_${day}_W${week}_E${exIdx}_S${s}`;
          const isDone = localStorage.getItem(key) === "true";
          const activeClass = isDone ? "completed" : "";
          const btnText = isDone ? `✓ Set ${s}` : `Set ${s}`;

          setsButtonsHtml += `
            <button class="check-btn ${activeClass}" 
                    onclick="toggleSet('${key}', this, ${s})">
              ${btnText}
            </button>
          `;
        }

        const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.query)}`;

        card.innerHTML = `
          <div class="card-header">
            <div class="exercise-title">${ex.name}</div>
            <div class="prescribed-badge">${targetText}</div>
          </div>
          <div class="rest-info">Rest: ${ex.rest}</div>
          
          <a href="${youtubeSearchUrl}" target="_blank" style="text-decoration: none;">
            <button class="video-btn">
              <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0z"/>
                <path d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445z"/>
              </svg>
              Watch Demo Video
            </button>
          </a>

          <div class="tracker-area">
            <label>LOG COMPLETED SETS:</label>
            <div class="check-grid">
              ${setsButtonsHtml}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function parseSetCount(targetText) {
      const match = targetText.match(/^(\d+)x/);
      if (match) return parseInt(match[1]);
      if (targetText.includes("2x")) return 2;
      if (targetText.includes("3x")) return 3;
      if (targetText.includes("4x")) return 4;
      if (targetText.includes("5x")) return 5;
      return 2; // Default reasonable fallback set count
    }

    function toggleSet(key, element, setNum) {
      const isCompleted = element.classList.contains("completed");
      if (isCompleted) {
        element.classList.remove("completed");
        element.textContent = `Set ${setNum}`;
        localStorage.setItem(key, "false");
      } else {
        element.classList.add("completed");
        element.textContent = `✓ Set ${setNum}`;
        localStorage.setItem(key, "true");
      }
    }

    // Initial render on page load
    renderWorkout();
  </script>
</body>
</html>
